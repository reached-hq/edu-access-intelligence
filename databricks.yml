# Databricks Asset Bundle for the Education Access Intelligence pipeline.
#
# Change the job by changing this file and deploying, not by editing it in the
# workspace: a UI edit does not reach this file, and the next deploy overwrites it.
#
# One job, edu_access_pipeline (#47): per source, a Python task that checks and
# loads its deliveries, then each layer's SQL from etl/ as its own task.
# Dashboards come in milestone 04 (Serve).
# Commands and checks: docs/operations/ingestion.md, "Running on Databricks".
bundle:
  name: edu-access-intelligence

variables:
  # The SQL warehouse that runs every sql_task. Warehouse ids are per
  # workspace: check `databricks warehouses list --profile reached-hq` if the
  # host changes. Override without editing this file:
  #   databricks bundle deploy --target dev --var="warehouse_id=<id>"
  warehouse_id:
    description: SQL warehouse that runs the job's SQL tasks (Serverless Starter Warehouse)
    default: 71d3ccb9cea611c0

resources:
  jobs:
    edu_access_pipeline:
      name: edu_access_pipeline
      description: >-
        Loads approved raw deliveries from the 00-source volume into 02-bronze,
        then runs each layer's SQL from etl/ as its own task, recording every
        run, batch, and check in 01-control. Rerunning it is safe: files
        already loaded are skipped.

      # Every row the job writes (Bronze, control, data-quality results) carries
      # the commit that produced it. Resolved at deploy time from the same
      # substitution as git_source below, so the commit that runs and the commit
      # recorded are the same value by construction.
      parameters:
        - name: code_revision
          default: ${bundle.git.commit}
        # One id for every SQL task of a run: a gate's results carry it, and
        # its last statement fails on any FAIL recorded under it. Python tasks
        # keep their own run id in pipeline_runs.
        - name: run_id
          default: "{{job.run_id}}"

      # A branch would be resolved when the job runs, a commit when the bundle is
      # deployed: with git_branch, deploying at commit A and then merging B runs
      # B's code while recording A. Pinning the commit means new code needs a
      # deploy, which is the point of a controlled deployment. The commit must be
      # pushed to GitHub before the job can run it.
      git_source:
        git_url: https://github.com/reached-hq/edu-access-intelligence
        git_provider: gitHub
        git_commit: ${bundle.git.commit}

      # One run at a time: two runs could both see a batch as new.
      max_concurrent_runs: 1
      queue:
        enabled: true

      # No schedule during development (docs/operations/workflow.md, Part 5). Runs are
      # started deliberately with `databricks bundle run`.

      tasks:
        # Per source: a Python task checks each delivery against its contract
        # and loads it (the files are zips with a declared encoding, which SQL
        # cannot read), then the SQL tasks run that source's files from etl/,
        # each only if the one before it succeeded. The Python task leaves the
        # Bronze gate to the SQL task after it (--no-gate).
        - task_key: bronze_deped_enrollment
          environment_key: ingestion
          spark_python_task:
            python_file: src/ingestion/cli.py
            # Without GIT, Databricks rejects a repository-relative path
            # ("Invalid python file reference"), even with git_source set.
            source: GIT
            parameters:
              - ingest
              - --no-gate
              - --backend
              - spark
              - --source
              - deped_enrollment
              - --landing
              - /Volumes/edu_access/00-source/raw
              - --environment
              - ${bundle.target}
              - --code-revision
              - "{{job.parameters.code_revision}}"

        - task_key: 90_validate_deped_enrollment_raw
          depends_on:
            - task_key: bronze_deped_enrollment
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/02_bronze/90_validate_deped_enrollment_raw.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

        # One task at a time, in one chain: parallel tasks would compete for
        # Free Edition's serverless capacity. The next source starts with
        # ALL_DONE, so it runs even if the previous source failed or was
        # stopped; the job still ends failed.
        - task_key: bronze_deped_facilities
          depends_on:
            - task_key: 90_validate_deped_enrollment_raw
          run_if: ALL_DONE
          environment_key: ingestion
          spark_python_task:
            python_file: src/ingestion/cli.py
            source: GIT
            parameters:
              - ingest
              - --no-gate
              - --backend
              - spark
              - --source
              - deped_facilities
              - --landing
              - /Volumes/edu_access/00-source/raw
              - --environment
              - ${bundle.target}
              - --code-revision
              - "{{job.parameters.code_revision}}"

        - task_key: 90_validate_deped_facilities_raw
          depends_on:
            - task_key: bronze_deped_facilities
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: etl/02_bronze/90_validate_deped_facilities_raw.sql
              source: GIT
            warehouse_id: ${var.warehouse_id}

      environments:
        - environment_key: ingestion
          spec:
            client: "2"

targets:
  # Name the host explicitly, so a deploy cannot land in whichever workspace
  # the CLI happens to be logged in to.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-76bcfddb-1669.cloud.databricks.com
