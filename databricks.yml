# Databricks Asset Bundle for the Education Access Intelligence pipeline.
#
# Change the job by changing this file and deploying, not by editing it in the
# workspace: a UI edit does not reach this file, and the next deploy overwrites it.
#
# Placeholder: no jobs or dashboards yet. The Bronze job is added with #11,
# dashboards in milestone 04 (Serve).
bundle:
  name: edu-access-intelligence

targets:
  # Name the host explicitly, so a deploy cannot land in whichever workspace
  # the CLI happens to be logged in to.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-76bcfddb-1669.cloud.databricks.com
