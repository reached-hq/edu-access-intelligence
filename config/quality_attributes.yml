# Name families (rule 3 above). Prefixes must not overlap.
families:
  labels_mapped_:
    attribute: Validity
    basis: One per mapped column; every label is in the reviewed mapping (config/mappings)
  level_count_:
    attribute: Reconciliation
    basis: One per PSGC level; the level's unit count equals the workbook's national summary

# Results that record a count and are always PASS by construction: how many rows
# a cleaning rule changed or flagged, how many matches each method made, how
# many rows of each kind a workbook has. They are evidence, not tests, so the
# dashboard shows them as "Recorded count" and leaves them out of the pass rate.
recorded_counts:
  checks:
    - flag_barangay_blank
    - flag_barangay_possibly_truncated
    - flag_enrollment_all_zero
    - flag_enrollment_no_counts
    - flag_es_classrooms_missing
    - flag_has_facility_data
    - flag_has_population_footnote
    - flag_is_overseas
    - flag_level_blank
    - flag_population_is_zero
    - flag_public_without_facility_data
    - match_rate_percent
    - principal_total_discrepancies
    - places_with_equal_concepts
  families:
    rule_: How many rows each cleaning rule changed
    method_: How many map rows each match method matched
    rows_kind_: How many workbook rows of each kind Silver read

# Checks deliberately left without an attribute, with the reason. They are shown
# as Unclassified, like an unknown check, but the explorer says why.
unclassified:
  - check: silver_lane_succeeded
    reason: Whether a source lane's Silver build succeeded in the job run; a pipeline outcome, shown with pipeline health
