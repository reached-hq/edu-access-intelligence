# Which data-quality attribute each check in data_quality_results tests (#97).
# Read by src/dashboard/data_quality.py, which builds the data-quality dashboard
# (dashboards/data_quality.lvdash.json); regenerate after a change:
#   python -m src.dashboard.data_quality > dashboards/data_quality.lvdash.json
#
# This file only labels checks for the dashboard. It does not change what a
# check does, its status, or any alert.
#
# How a recorded check_name finds its entry, first match wins:
#   1. exact: the check_name as recorded, after removing a leading "<sheet>: "
#      (Bronze checks of a workbook read sheet by sheet, src/ingestion/bronze.py
#      and xlsx_census.py);
#   2. qualified: the same name without one trailing "_<year>", "_household" or
#      "_total" (Silver gates that check each estimate year or census concept
#      separately, e.g. rows_reconcile_2018, key_unique_household);
#   3. family: a name that starts with one of the families below. Families are
#      only for names a generator builds from a list (one per mapped column,
#      cleaning rule, match method, or row kind).
# A name that matches nothing is shown as Unclassified, never hidden, and never
# counted as covering an attribute. tests/test_dashboard.py fails when a check
# a gate can write is not listed here.
#
# Some identifier checks are named after the source's identifier column
# (school_id_format, psgc_code_not_blank, "PSGC ID_unique_in_file"); a new
# source with a new identifier column needs its names added here.

version: 1

# Display order. Each attribute says what its checks look at.
attributes:
  - name: Completeness
    means: Expected rows, batches, years, or required values are present
  - name: Uniqueness
    means: No duplicate key, duplicate row, or second current version
  - name: Validity
    means: Formats, types, allowed values, ranges, file layout, and labels in the reviewed mapping
  - name: Accuracy
    means: Values agree with the published source or a reviewed reference
  - name: Consistency
    means: Related fields, rows, flags, versions, and profiled counts agree with each other
  - name: Timeliness
    means: The latest succeeded delivery is within its limit in config/freshness.yml
  - name: Referential integrity
    means: Rows resolve to a known batch, parent unit, or PSGC unit; match outcomes of the maps
  - name: Reconciliation
    means: Rows, values, and quarantined rows are accounted for between file, Bronze, and Silver
  - name: Lineage
    means: Run, batch, code revision, and provenance columns are filled for every row

